        <!-- Scripts & Grafischer Stammbaum Generator -->
            <script>
                // Funktion zum rekursiven Rendern des grafischen Stammbaums
                function renderGrafikBaum(mitglieder) {
                    if (!mitglieder || mitglieder.length === 0) return '';
                    let html = '<ul>';
                    mitglieder.forEach(m => {
                        html += `
                            <li>
                                <div class="member-card" data-name="${m.name}" data-status="${m.status}" data-bild="${m.bild || 'images/empty.png'}">
                                    <span class="member-name">${m.name}</span>
                                    <span class="member-status">${m.status}</span>
                                </div>
                        `;
                        if (m.kinder && m.kinder.length > 0) {
                            html += renderGrafikBaum(m.kinder);
                        }
                        html += `</li>`;
                    });
                    html += '</ul>';
                    return html;
                }

                // JSON-Daten laden und grafisch darstellen
                fetch('/assets/json/familien.json')
                    .then(response => {
                        if (!response.ok) throw new Error('Fehler beim Laden der Familien-Daten.');
                        return response.json();
                    })
                    .then(data => {
                        const container = document.getElementById('stammbaum-container');
                        container.innerHTML = '';

                        data.familien.forEach(familie => {
                            let famBox = document.createElement('div');
                            famBox.className = 'box alt stammbaum-box';
                            famBox.style.marginBottom = '5em';
                            famBox.innerHTML = `
                                <h3 style="text-align: center; color: #788ec2; margin-bottom: 0.5em;">${familie.name}</h3>
                                <p style="text-align: center; font-size: 0.95em; opacity: 0.8; margin-bottom: 2em;">${familie.beschreibung}</p>
                                <div class="tree">
                                    ${renderGrafikBaum(familie.mitglieder)}
                                </div>
                            `;
                            container.appendChild(famBox);
                        });

                        // Nach dem Rendern die Klick-Events für die Popups hinzufügen
                        initModals();
                    })
                    .catch(error => {
                        console.error('Fehler:', error);
                        document.getElementById('stammbaum-container').innerHTML = '<p class="align-center" style="color: #ff6b6b;">Fehler beim Laden der Stammbaum-Daten. Bitte stelle sicher, dass die familien.json im selben Ordner liegt.</p>';
                    });

                // Modal-Logik steuern
                function initModals() {
                    const modal = document.getElementById('member-modal');
                    const closeBtn = document.querySelector('.member-modal-close');
                    
                    const modalImg = document.getElementById('modal-img');
                    const modalName = document.getElementById('modal-name');
                    const modalStatus = document.getElementById('modal-status');

                    // Klick auf Karte öffnet Modal
                    document.querySelectorAll('.member-card').forEach(card => {
                        card.addEventListener('click', () => {
                            modalImg.src = card.getAttribute('data-bild');
                            modalName.textContent = card.getAttribute('data-name');
                            modalStatus.textContent = card.getAttribute('data-status');
                            modal.style.display = 'flex';
                        });
                    });

                    // Schließen über das X
                    closeBtn.addEventListener('click', () => {
                        modal.style.display = 'none';
                    });

                    // Schließen bei Klick außerhalb des Inhalts
                    window.addEventListener('click', (e) => {
                        if (e.target === modal) {
                            modal.style.display = 'none';
                        }
                    });
                }
            </script>

            <style>
                .hover-effect {
                    transition: transform 1s ease, opacity 1s ease;
                }
                .hover-effect:hover {
                    transform: scale(1.1);
                }

                /* --- Stammbaum Container & Abstände --- */
                .stammbaum-box {
                    margin-bottom: 5em !important;
                    padding-bottom: 1em;
                }

                .stammbaum-box:last-child {
                    margin-bottom: 2em !important;
                }

                /* --- Grafischer Stammbaum (CSS Tree Struktur) --- */
                .tree {
                    width: 100%;
                    overflow-x: auto;
                    padding: 20px 0;
                    text-align: center;
                }

                .tree ul {
                    padding-top: 20px; 
                    position: relative;
                    transition: all 0.5s;
                    display: flex;
                    justify-content: center;
                    list-style-type: none;
                    padding-left: 0;
                    margin: 0 !important;
                }

                .tree li {
                    float: left; 
                    text-align: center;
                    list-style-type: none;
                    position: relative;
                    padding: 20px 5px 0 5px;
                    transition: all 0.5s;
                }

                .tree li::before, .tree li::after {
                    content: '';
                    position: absolute; 
                    top: 0; 
                    right: 50%;
                    border-top: 1px solid rgba(255, 255, 255, 0.3);
                    width: 50%; 
                    height: 20px;
                }

                .tree li::after {
                    right: auto; 
                    left: 50%;
                    border-left: 1px solid rgba(255, 255, 255, 0.3);
                }

                .tree li:only-child::after, .tree li:only-child::before {
                    display: none;
                }

                .tree li:only-child {
                    padding-top: 0;
                }

                .tree li:first-child::before {
                    border: 0;
                }

                .tree li:last-child::after {
                    border: 0;
                }

                .tree li:last-child::before {
                    border-right: 1px solid rgba(255, 255, 255, 0.3);
                    border-radius: 0 5px 0 0;
                }

                .tree li:first-child::after {
                    border-left: 1px solid rgba(255, 255, 255, 0.3);
                    border-radius: 5px 0 0 0;
                }

                .tree ul ul::before {
                    content: '';
                    position: absolute; 
                    top: 0; 
                    left: 50%;
                    border-left: 1px solid rgba(255, 255, 255, 0.3);
                    width: 0; 
                    height: 20px;
                }

                /* --- Die Mitgliedskarten --- */
                .member-card {
                    display: inline-block;
                    background: #272833;
                    border: 1px solid rgba(255, 255, 255, 0.2);
                    padding: 10px 15px;
                    text-decoration: none;
                    border-radius: 6px;
                    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
                    transition: all 0.3s;
                    min-width: 140px;
                    cursor: pointer;
                }

                .member-card:hover {
                    border-color: #788ec2;
                    transform: translateY(-3px);
                    box-shadow: 0 6px 12px rgba(120, 142, 194, 0.3);
                }

                .member-name {
                    display: block;
                    font-size: 0.95em;
                    font-weight: bold;
                    color: #ffffff;
                    margin-bottom: 2px;
                }

                .member-status {
                    display: block;
                    font-size: 0.8em;
                    color: #788ec2;
                    text-transform: uppercase;
                    letter-spacing: 0.05em;
                }

                /* --- Popup-Modal Styling --- */
                .member-modal-overlay {
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(16, 17, 22, 0.8);
                    backdrop-filter: blur(4px);
                    z-index: 1000;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                }

                .member-modal-content {
                    background: #1c1d26;
                    border: 1px solid rgba(255, 255, 255, 0.15);
                    padding: 30px;
                    border-radius: 10px;
                    width: 90%;
                    max-width: 350px;
                    text-align: center;
                    position: relative;
                    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
                }

                .member-modal-close {
                    position: absolute;
                    top: 10px;
                    right: 15px;
                    font-size: 24px;
                    color: #fff;
                    cursor: pointer;
                    opacity: 0.7;
                    transition: opacity 0.2s;
                }

                .member-modal-close:hover {
                    opacity: 1;
                }

                .member-modal-body img {
                    width: 120px;
                    height: 120px;
                    object-fit: cover;
                    border-radius: 50%;
                    border: 2px solid #788ec2;
                    margin-bottom: 15px;
                }

                .member-modal-body h3 {
                    margin-bottom: 5px;
                    color: #ffffff;
                }
            </style>
