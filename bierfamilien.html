		<!-- Scripts & Grafischer Stammbaum Generator -->
			<script>
				// Funktion zum rekursiven Rendern des grafischen Stammbaums (Baumstruktur)
				function renderGrafikBaum(mitglieder) {
					if (!mitglieder || mitglieder.length === 0) return '';
					let html = '<ul>';
					mitglieder.forEach(m => {
						html += `
							<li>
								<div class="member-card">
									<span class="member-name">${m.name}</span>
									<span class="member-status">${m.status}</span>
								</div>
						`;
						if (m.kinder && m.kinder.length > 0) {
							html += renderGrafikBaum(m.kinder);
						}
						html += `</li>`;
					});
					html += '</ul>';
					return html;
				}

				// JSON-Daten laden und grafisch darstellen
				fetch('/assets/json/familien.json')
					.then(response => {
						if (!response.ok) throw new Error('Fehler beim Laden der Familien-Daten.');
						return response.json();
					})
					.then(data => {
						const container = document.getElementById('stammbaum-container');
						container.innerHTML = '';

						data.familien.forEach(familie => {
							let famBox = document.createElement('div');
							famBox.className = 'box alt stammbaum-box';
							famBox.style.marginBottom = '5em';
							famBox.innerHTML = `
								<h3 style="text-align: center; color: #788ec2; margin-bottom: 0.5em;">${familie.name}</h3>
								<p style="text-align: center; font-size: 0.95em; opacity: 0.8; margin-bottom: 2em;">${familie.beschreibung}</p>
								<div class="tree">
									${renderGrafikBaum(familie.mitglieder)}
								</div>
							`;
							container.appendChild(famBox);
						});
					})
					.catch(error => {
						console.error('Fehler:', error);
						document.getElementById('stammbaum-container').innerHTML = '<p class="align-center" style="color: #ff6b6b;">Fehler beim Laden der Stammbaum-Daten. Bitte stelle sicher, dass die familien.json im selben Ordner liegt.</p>';
					});
			</script>

			<style>
				.hover-effect {
					transition: transform 1s ease, opacity 1s ease;
				}
				.hover-effect:hover {
					transform: scale(1.1);
				}

				/* --- Stammbaum Container & Abstände --- */
				.stammbaum-box {
					margin-bottom: 5em !important; /* Erzwingt exakt 5em Abstand zwischen JEDER Familie */
					padding-bottom: 1em;
				}

				/* Letzte Familie braucht keinen riesigen Abstand zum Footer */
				.stammbaum-box:last-child {
					margin-bottom: 2em !important;
				}

				/* --- Grafischer Stammbaum (CSS Tree Struktur) --- */
				.tree {
					width: 100%;
					overflow-x: auto;
					padding: 20px 0;
					text-align: center;
				}

				.tree ul {
					padding-top: 20px; 
					position: relative;
					transition: all 0.5s;
					display: flex;
					justify-content: center;
					list-style-type: none;
					padding-left: 0;
					margin: 0 !important; /* Entfernt den Standard-Margin von ul aus der main.css */
				}

				.tree li {
					float: left; 
					text-align: center;
					list-style-type: none;
					position: relative;
					padding: 20px 5px 0 5px;
					transition: all 0.5s;
				}

				/* Verbindungslinien nach oben zu den Eltern */
				.tree li::before, .tree li::after {
					content: '';
					position: absolute; 
					top: 0; 
					right: 50%;
					border-top: 1px solid rgba(255, 255, 255, 0.3);
					width: 50%; 
					height: 20px;
				}

				.tree li::after {
					right: auto; 
					left: 50%;
					border-left: 1px solid rgba(255, 255, 255, 0.3);
				}

				/* Äußere Linien bei Einzelkindern entfernen */
				.tree li:only-child::after, .tree li:only-child::before {
					display: none;
				}

				.tree li:only-child {
					padding-top: 0;
				}

				.tree li:first-child::before {
					border: 0;
				}

				.tree li:last-child::after {
					border: 0;
				}

				.tree li:last-child::before {
					border-right: 1px solid rgba(255, 255, 255, 0.3);
					border-radius: 0 5px 0 0;
				}

				.tree li:first-child::after {
					border-left: 1px solid rgba(255, 255, 255, 0.3);
					border-radius: 5px 0 0 0;
				}

				/* Abwärts-Linien von Eltern zu Kindern */
				.tree ul ul::before {
					content: '';
					position: absolute; 
					top: 0; 
					left: 50%;
					border-left: 1px solid rgba(255, 255, 255, 0.3);
					width: 0; 
					height: 20px;
				}

				/* --- Die Mitgliedskarten (Boxen-Design) --- */
				.member-card {
					display: inline-block;
					background: #272833;
					border: 1px solid rgba(255, 255, 255, 0.2);
					padding: 10px 15px;
					text-decoration: none;
					border-radius: 6px;
					box-shadow: 0 4px 6px rgba(0,0,0,0.2);
					transition: all 0.3s;
					min-width: 140px;
				}

				.member-card:hover {
					border-color: #788ec2;
					transform: translateY(-3px);
					box-shadow: 0 6px 12px rgba(120, 142, 194, 0.3);
				}

				.member-name {
					display: block;
					font-size: 0.95em;
					font-weight: bold;
					color: #ffffff;
					margin-bottom: 2px;
				}

				.member-status {
					display: block;
					font-size: 0.8em;
					color: #788ec2;
					text-transform: uppercase;
					letter-spacing: 0.05em;
				}
			</style>
